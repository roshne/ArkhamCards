name: web-release

# Build and publish the web build's two images on a version tag: ghcr.io/roshne/arkhamcards-web
# (Dockerfile at the repo root) and ghcr.io/roshne/arkhamcards-api (web/api/Dockerfile). The host
# running web/compose.azure.yaml follows :latest through web/deploy's timer, so pushing a vX.Y.Z tag
# on web-poc is the whole deploy. Adapted from Rackbops/rackbops-web-deploy-template's
# servers/node-app/ci/release.yml.example.
#
# linux/amd64 only, authenticated with the built-in GITHUB_TOKEN (packages: write). ubuntu-latest:
# this repo is public, so never a self-hosted runner here. No workflow_dispatch: GitHub only offers
# it for workflows on the default branch, which this one isn't; re-run a tag's run to rebuild it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# One release at a time: the :latest decision reads the tag list at job start, so two overlapping
# builds could otherwise finish out of order and leave :latest on the older one.
concurrency:
  group: web-release
  cancel-in-progress: false

jobs:
  images:
    # Guarded so another fork tagging a v* skips cleanly instead of failing a publish it has no
    # rights for.
    if: github.repository == 'roshne/ArkhamCards'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag and branch, so the checks below can see the newest tag and web-poc.
          fetch-depth: 0

      - name: Validate the tag and decide whether it takes :latest
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' isn't a vX.Y.Z tag -- refusing to publish it." >&2
            exit 1
          fi
          # :latest is what the host deploys, so only a tag on web-poc may move it.
          if ! git merge-base --is-ancestor HEAD origin/web-poc; then
            echo "::error::$TAG is not on web-poc -- refusing to publish it." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # :latest follows the newest tag only, so rebuilding an older tag never rolls the host back.
          # Only tags this workflow would publish count (plain vX.Y.Z on web-poc): a stray
          # v1.0.0-rc1 or a tag elsewhere would otherwise sort first and hold :latest back forever.
          # A read loop, not `| head`: under the runner's pipefail, head closing the pipe early can
          # fail the step once there are many tags.
          newest=""
          while IFS= read -r t; do
            if [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then newest="$t"; break; fi
          done < <(git tag -l --merged origin/web-poc --sort=-v:refname 'v[0-9]*')
          if [[ "$TAG" == "$newest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is not the newest tag ($newest); :latest is left alone"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both builds push only the version tag; :latest moves in the last step, once both exist, so
      # a failed build never leaves the host pulling one new image beside one old one.
      - name: Build and push the api image
        uses: docker/build-push-action@v6
        with:
          context: web/api
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/roshne/ArkhamCards
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: ghcr.io/roshne/arkhamcards-api:${{ steps.meta.outputs.version }}

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/roshne/ArkhamCards
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: ghcr.io/roshne/arkhamcards-web:${{ steps.meta.outputs.version }}

      # api before web, the same order the host's timer swaps them in.
      - name: Point :latest at this version
        if: steps.meta.outputs.latest == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for image in arkhamcards-api arkhamcards-web; do
            docker buildx imagetools create -t "ghcr.io/roshne/$image:latest" \
              "ghcr.io/roshne/$image:$VERSION"
          done
