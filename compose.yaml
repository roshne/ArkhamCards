# Arkham Cards web POC on nitro, as a Dockge stack (/opt/stacks/arkhamcards is this checkout).
# Update: git pull && docker compose up -d --build
services:
  arkhamcards-web:
    build: .
    image: arkhamcards-web:poc
    container_name: arkhamcards-web
    restart: unless-stopped
    ports:
      # nitro's LAN address: http://192.168.7.26:8796 from any device on the LAN. Docker
      # publishes past ufw, so no firewall rule is involved.
      - "192.168.7.26:8796:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 1m
      timeout: 5s
