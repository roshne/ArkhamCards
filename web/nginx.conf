# server{} fragment for nginx:alpine's conf.d (the base image supplies http{}).
server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # The bundled card DB (24 MB) and campaign text compress well.
    gzip on;
    gzip_types application/javascript application/json application/octet-stream text/plain text/css image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        return 200;
    }

    # Expo export names bundles and assets by content hash: cache forever, and 404 when missing
    # rather than answering a stale script request with index.html.
    location ~ ^/(_expo|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
