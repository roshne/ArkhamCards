# Arkham Cards web POC, behind Cloudflare Access at https://arkhamcards.rackbops.com. Nothing
# publishes a host port: a cloudflared token sidecar reaches the app on the compose network (tunnel
# ingress: http://web:80). Both app images come from ghcr.io, built by
# .github/workflows/web-release.yml on a vX.Y.Z tag; web/deploy's timer pulls :latest. On the host
# this file is the stack's compose.yaml; CLOUDFLARE_TUNNEL_TOKEN, ACCESS_TEAM_DOMAIN and ACCESS_AUD
# are in the stack's .env, never here (web/README.md has the setup).
name: arkhamcards

services:
  api:
    # Per-user saved state: verifies each request's Access JWT, keeps data in the `state` volume.
    image: ghcr.io/roshne/arkhamcards-api:${IMAGE_TAG:-latest}
    container_name: arkhamcards-api
    restart: unless-stopped
    mem_limit: 256m
    environment:
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:?ACCESS_TEAM_DOMAIN is unset -- set it in .env}
      - ACCESS_AUD=${ACCESS_AUD:?ACCESS_AUD is unset -- set it in .env}
      - DATA_DIR=/data
    volumes:
      - state:/data
    # Root (the new volume is root-owned) but with every capability dropped and a read-only root.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/healthz"]
      interval: 1m
      timeout: 5s
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/roshne/arkhamcards-web:${IMAGE_TAG:-latest}
    container_name: arkhamcards-web
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 1m
      timeout: 5s
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    # Pinned, never :latest; bump the tag here and redeploy by hand (the timer only swaps web/api).
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is unset -- set it in .env}
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Everyone's saved decks, campaigns and settings: back this up before removing the stack.
  state:
